name: Build Termux Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Cordova
      run: npm install -g cordova
      
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install dependencies
      run: npm install
      
    - name: Add Android platform
      run: cordova platform add android@14.0.0
      
    - name: Add Termux permissions
      run: |
        mkdir -p platforms/android/app/src/main
        cat >> platforms/android/app/src/main/AndroidManifest.xml << 'EOL'
        <queries>
          <package android:name="com.termux" />
        </queries>
        EOL
        
    - name: Build APK
      run: cordova build android --release -- --packageType=apk
      
    - name: Rename APK
      run: |
        if [ -f "platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk TermuxLauncher.apk
        elif [ -f "platforms/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk TermuxLauncher-debug.apk
        fi
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Termux-Launcher-APK
        path: ./*.apk
        if-no-files-found: error
